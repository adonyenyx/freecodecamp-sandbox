<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Playground</title>
    <link rel="stylesheet" href="string.css">
    <script defer src="string.js"></script>  
  </head>
  <body>

    <main>
      <form novalidate>
        <label for="userInput"></label>
        <input type="text" name="userInput" id="userInput" placeholder="Insert a String">
        <!-- <button type="submit" id="submitBtn">Submit</button> -->
      </form>

      <div>
        <button type="submit" id="upperCaseBtn">Upper Case</button>
        <button type="submit" id="lowerCaseBtn">Lower Case</button>
      </div>

      <div class="display-user-input" id="displayUserInput">
        <p id="inputResult"></p>
      </div>


    </main>
    
  </body>
</html>
