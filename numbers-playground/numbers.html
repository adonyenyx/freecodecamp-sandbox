<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="numbers.css">
    <script defer src="numbers.js"></script>
    <title>Numbers Playground</title>
    
  </head>
  
  <body>
    <main>
      <div class="number-container">
        <p id="numText"></p>
      </div>
      <form novalidate>
        <label for="number-input">Enter a Number!</label> <br>
        <input type="number" name="number-input" placeholder="#" id="input">
      </form>
      <div class="methods-container">
        <button type="submit" id="randomBtn">Generate Random</button>
        <button type="submit" id="multByTwo">x2</button>
      </div>
    </main>
  </body>
</html>
